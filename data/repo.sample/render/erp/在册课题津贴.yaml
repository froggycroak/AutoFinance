# 任务模板的 A-ERP 指向本文件。

标题: 津贴申请单
基本信息:
  - [单据编号, 报销类型, 付款日期, 报销人]
  - [报销人公司, 报销人部门, 收款人, 费用承担单位]
  - [费用承担部门, 项目类型, 项目, 个税科目]
  - [预算类别, 报销金额, 事由, 交易对象类型]
字段:
  单据编号: "{this.A-单据编号}"
  报销类型: "L3 津贴申请单"
  付款日期: "{this.A-付款日期}"
  报销人: "{this.B-报销人.A-姓名} {this.B-报销人.A-工号}"
  报销人公司: "{this.B-报销人.B-所属部门.B-所属公司.A-公司编号} {this.B-报销人.B-所属部门.B-所属公司.A-公司全称}"
  报销人部门: "{this.B-报销人.B-所属部门.A-部门编号} {this.B-报销人.B-所属部门.A-部门全称}"
  收款人: "{this.B-报销人.A-姓名} {this.B-报销人.A-工号}"
  费用承担单位: "{this.B-报销人.B-所属部门.B-所属公司.A-公司编号} {this.B-报销人.B-所属部门.B-所属公司.A-公司全称}"
  费用承担部门: "{this.B-报销人.B-所属部门.A-部门编号} {this.B-报销人.B-所属部门.A-部门全称}"
  项目类型: "{this.B-报销项目.A-项目类型}"
  项目: "{this.B-报销项目.A-项目编号} {this.B-报销项目.A-项目名称}"
  个税科目: "{this.B-报销模板.B-个税科目.A-科目编码} {this.B-报销模板.B-个税科目.A-科目名称}"
  预算类别: "{this.B-报销项目.B-预算类别.A-类别编码} {this.B-报销项目.B-预算类别.A-类别名称}"
  报销金额: "{this.A-总金额|小写}"
  事由: "{this.A-事由}"
  交易对象类型: "在册人员"
报销明细:
  repeat: this.B-劳务人员
  列:
    - 费用类型
    - 姓名
    - 工号
    - 部门
    - 手机号
    - 证件号
    - 开户行
    - 账号
    - 发放金额
    - 代扣税额
  字段:
    费用类型: "{this.B-报销模板.B-费用类型.A-费用类型编号} {this.B-报销模板.B-费用类型.A-费用类型名称}"
    姓名: "{row.B-人员.A-姓名}"
    工号: "{row.B-人员.A-工号}"
    部门: "{row.B-人员.B-所属部门.A-部门简称}"
    手机号: "{row.B-人员.A-手机号}"
    证件号: "{row.B-人员.A-身份证号}"
    开户行: "{row.B-人员.A-收款开户支行}"
    账号: "{row.B-人员.A-收款银行账号}"
    发放金额: "{row.A-发放金额|小写}"
    代扣税额: "{row.A-个人所得税|小写}"
