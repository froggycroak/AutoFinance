# 付给代理机构的对外付款单。

标题: 对外付款单
基本信息:
  - [单据编号, 报销类型, 付款日期, 报销人]
  - [报销人公司, 报销人部门, 收款人, 费用承担单位]
  - [项目类型, 项目, 课题编号, 供应商]
  - [交易对象类型, 预算类别, 报销金额, 年月]
  - [事由]
字段:
  单据编号: "{this.A-单据编号}"
  报销类型: "P2 对外付款单"
  付款日期: "{this.A-付款日期}"
  报销人: "{this.B-报销人.A-姓名} {this.B-报销人.A-工号}"
  报销人公司: "{this.B-报销人.B-所属部门.B-所属公司.A-公司编号} {this.B-报销人.B-所属部门.B-所属公司.A-公司全称}"
  报销人部门: "{this.B-报销人.B-所属部门.A-部门编号} {this.B-报销人.B-所属部门.A-部门全称}"
  收款人: "{this.B-报销人.A-姓名} {this.B-报销人.A-工号}"
  费用承担单位: "{this.B-报销人.B-所属部门.B-所属公司.A-公司编号} {this.B-报销人.B-所属部门.B-所属公司.A-公司全称}"
  项目类型: "{this.B-报销项目.A-项目类型}"
  项目: "{this.B-报销项目.A-项目编号} {this.B-报销项目.A-项目名称}"
  课题编号: "{this.B-报销项目.A-课题编号}"
  供应商: "{this.B-供应商.A-供应商全称}"
  交易对象类型: "收款单位"
  预算类别: "{this.B-报销项目.B-预算类别.A-类别编码} {this.B-报销项目.B-预算类别.A-类别名称}"
  报销金额: "{this.A-总金额|小写}"
  年月: "{this.A-付款日期|年月}"
  事由: "{this.A-事由}"
费用明细:
  列:
    - 费用类型
    - 报销金额
    - 年月
    - 收款单位
  字段:
    费用类型: "{this.B-报销模板.B-费用类型.A-费用类型编号} {this.B-报销模板.B-费用类型.A-费用类型名称}"
    报销金额: "{this.A-总金额|小写}"
    年月: "{this.A-付款日期|年月}"
    收款单位: "{this.B-供应商.A-供应商简称}"
