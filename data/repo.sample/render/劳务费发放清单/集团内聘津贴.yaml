发放清单:
  标题: 集团内协作津贴清单
  项目栏: 协作课题
  类型栏: 来源
  项目: "{this.B-报销项目.A-项目名称}（{this.B-报销项目.A-课题编号}）"
  项目类型: "{this.B-报销项目.A-项目类型}"
  列:
    - 序号
    - 姓名
    - 来源
    - 事由
    - 金额
    - 附注
  字段:
    姓名: "{row.B-人员.A-姓名}"
    事由: "{row.A-发放事由}"
    金额: "{row.A-发放金额|小写}"
    附注: "{row.A-备注}"
    来源: "{row.A-人员类别}"
  合计: "{this.A-总金额|小写}"
  落款:
    - 归口负责人
    - 财务分管
    - 课题负责人
发放说明:
  标题: 协作津贴说明
  发放时间: "{this.A-发放时间}"
  报销单编号: "{this.A-单据编号}"
  阶段名称: "{this.A-阶段名称}"
  阶段计划及目标: "{this.A-阶段计划及目标}"
  成果形式: "{this.A-成果形式}"
  列:
    - 序号
    - 姓名
    - 工作内容
    - 成果
    - 来源
    - 金额
  字段:
    姓名: "{row.B-人员.A-姓名}"
    工作内容: "{row.A-工作内容}"
    成果: "{row.A-成果}"
    金额: "{row.A-发放金额|小写}"
    来源: "{row.A-人员类别}"
  合计: "{this.A-总金额|小写}"
